function poly(x,y,z,rx,ry,rz,c,segments=10,rings=6){let v=[],f=[];for(let j=0;j<=rings;j++){let a=Math.PI*j/rings;for(let i=0;i<segments;i++){let t=Math.PI*2*i/segments;v.push([x+Math.sin(a)*Math.cos(t)*rx,y+Math.cos(a)*ry,z+Math.sin(a)*Math.sin(t)*rz])}}for(let j=0;j<rings;j++)for(let i=0;i<segments;i++)f.push([j*segments+i,j*segments+(i+1)%segments,(j+1)*segments+(i+1)%segments,(j+1)*segments+i]);mesh(v,f,c)}
