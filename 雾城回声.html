'use strict';
const $=id=>document.getElementById(id),stage=$('stage'),fx=$('fx'),paint=fx.getContext('2d'),gl=stage.getContext('webgl',{antialias:true,alpha:false,powerPreference:'low-power'});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const chapters=[
{id:'hotel',name:'停电的高楼',place:'长沙柏悦 / IFS',symbol:'火',brief:'找到备用电芯，让电梯重新呼吸。',hint:['电梯失去了电芯；酒店货箱可以移动。','把电芯放进配电箱，再把货箱压在黄铜踏板上。','先去左侧台阶拾电芯；到中央装入；拖货箱到 x=5 的踏板并松手。'],clue:'柜台便签：电芯归位，重物留在铜板上。只点亮灯，门不会打开。'},
{id:'academy',name:'书院的无声铃',place:'岳麓书院',symbol:'书',brief:'四盏灯，只有一种顺序能让铃声回来。',hint:['石碑上的句子描述了一段从书院到城市的路。','先书、再山、再水、最后城。四盏灯的位置和顺序无关。','从左到右的灯是水、城、书、山；依次点第三、第四、第一、第二盏。'],clue:'石碑残文：先有书声，次见青山；水接山影，城收水光。灯若误序，书声归寂。'},
{id:'island',name:'沉下去的渡桥',place:'橘子洲 / 湘江',symbol:'水',brief:'转动水闸，让船坞与渡桥在同一刻重合。',hint:['水闸会改变整条河的水位；岸壁上有不同高度的刻度。','残页显示左岸刻度三、右岸刻度一。两座闸门分别控制一段桥。','左闸调为3，右闸调为1；两侧渡桥都浮起后，跳过连接处的小缝。'],clue:'渡工残页：左岸三痕，右岸一痕。水不是越低越好；桥要同时醒来。'},
{id:'oldstreet',name:'没有主人的影子',place:'潮宗街',symbol:'影',brief:'把三段影子拼回一扇门。',hint:['铜牌的缺口对应三个转盘的朝向。','看墙上的影子：左片向右，中片向上，右片向左。','将左轮转至→，中轮转至↑，右轮转至←，再拉墙边的确认杆。'],clue:'旧宅铜牌：左影朝东，中影指天，右影向西。轮子不会替你确认答案；墙边另有锁杆。'},

function getNoiseBuffer(){if(noiseBuffer||!audio)return noiseBuffer;try{const sz=audio.sampleRate*1.5,b=audio.createBuffer(1,sz,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<sz;i++)d[i]=Math.random()*2-1;noiseBuffer=b;}catch(e){}return noiseBuffer;}
function foleyStep(sneak,cid){if(!sound||!audio)return;try{const t=audio.currentTime,osc=audio.createOscillator(),og=audio.createGain();osc.type='sine';const bf=cid==='academy'?85:cid==='island'?110:75;osc.frequency.setValueAtTime(bf,t);osc.frequency.exponentialRampToValueAtTime(35,t+.07);og.gain.setValueAtTime(sneak?.006:.016,t);og.gain.exponentialRampToValueAtTime(.0001,t+.08);osc.connect(og).connect(audio.destination);osc.start(t);osc.stop(t+.09);const nb=getNoiseBuffer();if(nb){const src=audio.createBufferSource();src.buffer=nb;const flt=audio.createBiquadFilter(),ng=audio.createGain();flt.type=cid==='island'?'bandpass':'lowpass';flt.frequency.value=cid==='island'?(sneak?620:920):cid==='academy'?(sneak?260:380):(sneak?320:480);if(cid==='island')flt.Q.value=1.8;ng.gain.setValueAtTime(sneak?.004:(cid==='island'?.014:.011),t);ng.gain.exponentialRampToValueAtTime(.0001,t+(cid==='island'?.09:.06));src.connect(flt).connect(ng).connect(audio.destination);src.start(t);src.stop(t+.1);}}catch(e){}}
function foleyLamp(on){if(!sound||!audio)return;try{const t=audio.currentTime,osc=audio.createOscillator(),g=audio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(on?1200:850,t);osc.frequency.exponentialRampToValueAtTime(on?640:420,t+.08);g.gain.setValueAtTime(.02,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);osc.connect(g).connect(audio.destination);osc.start(t);osc.stop(t+.1);const p=audio.createOscillator(),pg=audio.createGain();p.type='sine';p.frequency.setValueAtTime(on?2800:2100,t);pg.gain.setValueAtTime(.012,t);pg.gain.exponentialRampToValueAtTime(.0001,t+.12);p.connect(pg).connect(audio.destination);p.start(t);p.stop(t+.13);}catch(e){}}
function foleyHeartbeat(lvl){if(!sound||!audio)return;try{const t=audio.currentTime,beat=(dt,f,v)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f+lvl*25,t+dt);o.frequency.exponentialRampToValueAtTime(32,t+dt+.14);g.gain.setValueAtTime(v*(.015+lvl*.035),t+dt);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.16);o.connect(g).connect(audio.destination);o.start(t+dt);o.stop(t+dt+.18);};beat(0,68,1.0);beat(.12,58,.75);}catch(e){}}
function chime(type='good'){if(!sound||!audio)return;try{const t=audio.currentTime;if(type==='dissonance'){for(const f of [185,196]){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(60,t+.65);g.gain.setValueAtTime(.022,t);g.gain.exponentialRampToValueAtTime(.0001,t+.68);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.7);}return;}const o=audio.createOscillator(),g=audio.createGain();o.type=type==='gear'?'sawtooth':type==='scrape'?'triangle':'sine';const startF=type==='wrong'?92:type==='click'?240:type==='jump'?180:type==='scrape'?95:type==='gear'?320:type==='bell'?880:520;const endF=type==='wrong'?68:type==='scrape'?65:type==='gear'?110:type==='bell'?440:260;const dur=type==='bell'?.75:type==='gear'?.1:type==='scrape'?.18:.45;o.frequency.setValueAtTime(startF,t);o.frequency.exponentialRampToValueAtTime(endF,t+.25);g.gain.setValueAtTime(type==='scrape'?.012:type==='gear'?.022:type==='bell'?.03:.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function toggleSound(){sound=!sound;if(sound&&!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)();audioGain=audio.createGain();audioGain.gain.value=0;const osc=audio.createOscillator();osc.type='sine';osc.frequency.value=62;osc.connect(audioGain).connect(audio.destination);osc.start()}catch(e){sound=false;toast('此浏览器暂不支持声音')}}if(audio){audio.resume().catch(()=>{});if(audioGain)audioGain.gain.setTargetAtTime(sound?.009:0,audio.currentTime,.2)}$('soundbtn').textContent='声音 · '+(sound?'开':'关');$('soundbtn').setAttribute('aria-pressed',String(sound))}

const touchEl=$('touch'),knob=$('stickKnob');
function applyStick(cx,cy){if(!touchEl)return;const r=touchEl.getBoundingClientRect(),midX=r.left+r.width/2,midY=r.top+r.height/2;let dx=cx-midX,dy=cy-midY;const dist=Math.hypot(dx,dy),maxR=36;if(dist>maxR){dx=(dx/dist)*maxR;dy=(dy/dist)*maxR;}if(knob)knob.style.transform=`translate(${dx}px,${dy}px)`;if(dist>5){stick.x=dx/maxR;stick.z=dy/maxR;}else{stick.x=0;stick.z=0;}document.querySelectorAll('#touch .pad button').forEach(btn=>{const k=btn.dataset.key;let act=false;if(dist>6){if(k==='d'&&dx>10&&Math.abs(dx)>Math.abs(dy))act=true;if(k==='a'&&dx<-10&&Math.abs(dx)>Math.abs(dy))act=true;if(k==='s'&&dy>10&&Math.abs(dy)>=Math.abs(dx))act=true;if(k==='w'&&dy<-10&&Math.abs(dy)>=Math.abs(dx))act=true;}btn.classList.toggle('active',act);});}
function stopStick(e){if(stick.id!==null&&(e&&e.pointerId!==stick.id))return;stick.active=false;stick.id=null;stick.x=0;stick.z=0;if(knob)knob.style.transform='translate(0,0)';document.querySelectorAll('#touch .pad button').forEach(btn=>btn.classList.remove('active'));}
if(touchEl){touchEl.addEventListener('pointerdown',e=>{if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();stick.active=true;stick.id=e.pointerId;applyStick(e.clientX,e.clientY);touchEl.setPointerCapture(e.pointerId);});touchEl.addEventListener('pointermove',e=>{if(!stick.active||e.pointerId!==stick.id)return;applyStick(e.clientX,e.clientY);});touchEl.addEventListener('pointerup',stopStick);touchEl.addEventListener('pointercancel',stopStick);touchEl.addEventListener('lostpointercapture',stopStick);}
